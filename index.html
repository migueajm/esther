<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>For Miriam ✨</title>
<link rel="icon" href="./favicon-miriam.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">

<style>

/* ======================================================
   RESET
====================================================== */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:'Inter',sans-serif;
  overflow-x:hidden;
  background:#050816;
  color:white;
  min-height:100vh;
  position:relative;
}

/* ======================================================
   COSMIC BACKGROUND
====================================================== */

.space-background{
  position:fixed;
  inset:0;
  overflow:hidden;
  z-index:-10;
}

.nebula{
  position:absolute;
  border-radius:50%;
  filter:blur(120px);
  opacity:.35;
  animation:nebulaMove 30s ease-in-out infinite alternate;
}

.nebula-1{
  width:600px;
  height:600px;
  background:#4f46e5;
  top:-100px;
  left:-150px;
}

.nebula-2{
  width:500px;
  height:500px;
  background:#ec4899;
  top:30%;
  right:-100px;
  animation-duration:35s;
}

.nebula-3{
  width:450px;
  height:450px;
  background:#06b6d4;
  bottom:-120px;
  left:20%;
  animation-duration:40s;
}

@keyframes nebulaMove{
  from{
    transform:translateY(0) translateX(0) scale(1);
  }
  to{
    transform:translateY(40px) translateX(30px) scale(1.15);
  }
}

/* ======================================================
   STARS CANVAS
====================================================== */

#starsCanvas{
  position:fixed;
  inset:0;
  z-index:-9;
}

/* ======================================================
   INTRO
====================================================== */

.intro{
  position:fixed;
  inset:0;
  background:#03050d;
  z-index:99999;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  transition:1.5s ease;
}

.intro.hidden{
  opacity:0;
  pointer-events:none;
}

.intro-text{
  font-size:1.2rem;
  letter-spacing:4px;
  text-transform:uppercase;
  opacity:.7;
  animation:pulse 2s infinite;
}

.intro-stars{
  margin-top:30px;
  font-size:2rem;
  animation:float 3s ease-in-out infinite;
}

@keyframes pulse{
  0%,100%{opacity:.4;}
  50%{opacity:1;}
}

/* ======================================================
   LANGUAGE SWITCHER
====================================================== */

.language-switcher{
  position:fixed;
  top:20px;
  right:20px;
  z-index:999;
  display:flex;
  gap:10px;
}

.lang-btn{
  border:none;
  padding:10px 15px;
  border-radius:999px;
  background:rgba(255,255,255,0.08);
  color:white;
  cursor:pointer;
  border:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(12px);
  transition:.3s ease;
}

.lang-btn.active{
  background:linear-gradient(135deg,#63e6ff,#8b5cf6);
  box-shadow:0 0 25px rgba(99,230,255,.4);
}

/* ======================================================
   MUSIC BUTTON
====================================================== */

.music-btn{
  position:fixed;
  bottom:20px;
  right:20px;
  width:58px;
  height:58px;
  border-radius:50%;
  border:none;
  background:rgba(255,255,255,.08);
  color:white;
  font-size:1.2rem;
  cursor:pointer;
  backdrop-filter:blur(12px);
  z-index:999;
  transition:.3s ease;
}

.music-btn:hover{
  transform:scale(1.08);
}

/* ======================================================
   HERO
====================================================== */

header{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:40px;
  position:relative;
}

.hero{
  max-width:950px;
}

.badge{
  display:inline-flex;
  gap:10px;
  align-items:center;
  padding:10px 18px;
  border-radius:999px;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(12px);
  margin-bottom:30px;
}

.dot{
  width:10px;
  height:10px;
  border-radius:50%;
  background:#63e6ff;
  box-shadow:0 0 15px #63e6ff;
}

h1{
  font-family:'Space Grotesk',sans-serif;
  font-size:clamp(3rem,8vw,7rem);
  line-height:1;
  letter-spacing:-4px;
  margin-bottom:30px;
}

.gradient{
  background:linear-gradient(135deg,#63e6ff,#c084fc,#ec4899);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.subtitle{
  font-size:1.15rem;
  line-height:2;
  opacity:.8;
  max-width:720px;
  margin:auto;
}

.scroll{
  margin-top:60px;
  opacity:.6;
  animation:float 3s ease-in-out infinite;
}

@keyframes float{
  0%,100%{
    transform:translateY(0);
  }
  50%{
    transform:translateY(10px);
  }
}

/* ======================================================
   SECTIONS
====================================================== */

section{
  width:min(1100px,92%);
  margin:auto;
  padding:120px 0;
}

.section-title{
  text-align:center;
  font-size:3rem;
  margin-bottom:20px;
  font-family:'Space Grotesk',sans-serif;
}

.section-description{
  text-align:center;
  opacity:.7;
  max-width:700px;
  margin:0 auto 60px;
  line-height:1.8;
}

/* ======================================================
   CARDS
====================================================== */

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:30px;
}

.card{
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.08);
  border-radius:30px;
  padding:35px;
  backdrop-filter:blur(14px);
  transition:.4s ease;
  position:relative;
  overflow:hidden;
  isolation:isolate;
}

.card::before{
  content:"";
  position:absolute;
  width:260px;
  height:260px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(99,230,255,.22) 0%,rgba(139,92,246,.1) 38%,transparent 70%);
  top:-145px;
  right:-115px;
  filter:blur(8px);
  pointer-events:none;
  z-index:-1;
  transition:transform .6s ease,opacity .6s ease;
}

.card::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  background:linear-gradient(125deg,rgba(255,255,255,.07),transparent 35%);
  pointer-events:none;
  z-index:-1;
}

.card:hover{
  transform:translateY(-10px);
  border-color:rgba(99,230,255,.35);
  box-shadow:0 0 35px rgba(99,230,255,.15);
}

.card:hover::before{
  transform:translate(-18px,18px) scale(1.12);
  opacity:.9;
}

.card h3{
  margin-bottom:18px;
  font-size:1.4rem;
  position:relative;
  z-index:1;
}

.card p{
  opacity:.75;
  line-height:1.9;
  position:relative;
  z-index:1;
}

/* ======================================================
   QUOTE
====================================================== */

.quote-section{
  text-align:center;
}

.quote{
  font-size:clamp(1.7rem,4vw,3rem);
  line-height:1.6;
  max-width:900px;
  margin:auto;
  font-family:'Space Grotesk',sans-serif;
}

.quote-author{
  margin-top:30px;
  opacity:.6;
}

/* ======================================================
   LETTER
====================================================== */

.letter{
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.08);
  border-radius:35px;
  padding:50px;
  backdrop-filter:blur(15px);
  max-width:850px;
  margin:auto;
}

.letter p{
  line-height:2;
  opacity:.82;
  margin-bottom:24px;
}

.letter-signature{display:flex;align-items:center;gap:14px;margin-top:34px;color:#c4b5fd;font-family:'Space Grotesk',sans-serif}
.letter-signature::before{content:"";width:42px;height:1px;background:linear-gradient(90deg,transparent,#c4b5fd)}

/* DAILY STAR */
.daily-star{text-align:center}
.daily-capsule{max-width:780px;margin:0 auto;padding:clamp(32px,6vw,64px);border:1px solid rgba(255,255,255,.12);border-radius:40px;background:radial-gradient(circle at 50% 0,rgba(192,132,252,.2),transparent 45%),rgba(255,255,255,.045);backdrop-filter:blur(18px);box-shadow:0 30px 80px rgba(0,0,0,.25);position:relative;overflow:hidden}
.daily-kicker{color:#a5f3fc;font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;margin-bottom:22px}
.daily-message{font-family:'Space Grotesk',sans-serif;font-size:clamp(1.45rem,4vw,2.35rem);line-height:1.55}
.daily-date{margin-top:26px;opacity:.55;font-size:.9rem;text-transform:capitalize}

.content-refresh{animation:contentRefresh .65s ease both}
@keyframes contentRefresh{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}

/* ======================================================
   WISH SECTION
====================================================== */

.wish-section{
  text-align:center;
}

.wish-button{
  margin-top:40px;
  padding:18px 30px;
  border:none;
  border-radius:999px;
  background:linear-gradient(135deg,#63e6ff,#8b5cf6);
  color:white;
  cursor:pointer;
  font-size:1rem;
  transition:.4s ease;
}

.wish-button:hover{
  transform:scale(1.05);
}

.wish-message{
  margin-top:40px;
  opacity:0;
  transform:translateY(20px);
  transition:1s ease;
  font-size:1.3rem;
  max-width:700px;
  margin-inline:auto;
  line-height:1.8;
}

.wish-message.show{
  opacity:1;
  transform:translateY(0);
}

/* ======================================================
   SHOOTING STAR
====================================================== */

.shooting-star{
  position:fixed;
  width:3px;
  height:3px;
  background:white;
  border-radius:50%;
  box-shadow:0 0 20px white;
  z-index:-1;
  animation:shoot 2s linear forwards;
}

.shooting-star::after{
  content:"";
  position:absolute;
  width:180px;
  height:2px;
  background:linear-gradient(to right,white,transparent);
  transform:translateX(-100%);
}

@keyframes shoot{
  from{
    transform:translate(0,0);
    opacity:1;
  }
  to{
    transform:translate(-800px,500px);
    opacity:0;
  }
}

/* ======================================================
   BIRTHDAY MODE
====================================================== */

.birthday-banner{
  position:fixed;
  top:4rem;
  left:50%;
  transform:translateX(-50%);
  background:linear-gradient(135deg,#ec4899,#8b5cf6,#63e6ff);
  padding:22px 35px;
  border-radius:20px;
  z-index:9999;
  box-shadow:0 0 40px rgba(236,72,153,.45);
  animation:float 4s ease-in-out infinite;
}

/* ======================================================
   BIRTHDAY EXPERIENCE
====================================================== */

.birthday-experience{position:fixed;inset:0;z-index:100000;background:#02030c;display:none;place-items:center;overflow:hidden;padding:24px}
.birthday-experience.show{display:grid;animation:birthdayReveal 1.4s ease both}
.birthday-sky{position:absolute;inset:0;width:100%;height:100%}
.birthday-glow{position:absolute;width:min(70vw,800px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(139,92,246,.2),transparent 68%);filter:blur(20px);animation:moonPulse 6s ease-in-out infinite alternate}
.birthday-content{position:relative;z-index:2;text-align:center;width:min(900px,94vw);padding:clamp(28px,6vw,64px);border:1px solid rgba(255,255,255,.14);border-radius:40px;background:rgba(3,5,18,.5);backdrop-filter:blur(12px);box-shadow:0 0 100px rgba(99,230,255,.12)}
.birthday-eyebrow{letter-spacing:.28em;text-transform:uppercase;color:#a5f3fc;font-size:.72rem;margin-bottom:20px}
.birthday-title{font-family:'Space Grotesk',sans-serif;font-size:clamp(2.8rem,9vw,6.7rem);line-height:.95;letter-spacing:-.05em;background:linear-gradient(120deg,#fff,#a5f3fc,#c4b5fd,#f9a8d4);background-size:250% 250%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:birthdayGradient 5s ease infinite}
.birthday-copy{max-width:700px;margin:28px auto 0;font-size:clamp(1rem,2.5vw,1.25rem);line-height:1.9;color:rgba(255,255,255,.85)}
.birthday-enter{margin-top:30px;padding:15px 26px;border:1px solid rgba(255,255,255,.2);border-radius:999px;background:linear-gradient(135deg,#06b6d4,#8b5cf6,#ec4899);color:#fff;font:600 1rem 'Inter',sans-serif;cursor:pointer;box-shadow:0 0 35px rgba(139,92,246,.35)}
.birthday-wish-stream{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.flying-wish{position:absolute;left:105%;white-space:nowrap;color:rgba(255,255,255,.82);font-size:clamp(.72rem,1.6vw,.95rem);text-shadow:0 0 12px #fff;animation:wishFly var(--duration) linear forwards}
.birthday-close{position:absolute;top:18px;right:18px;z-index:5;width:44px;height:44px;border:1px solid rgba(255,255,255,.18);border-radius:50%;background:rgba(255,255,255,.08);color:#fff;font-size:1.2rem;cursor:pointer}
@keyframes birthdayReveal{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:scale(1)}}
@keyframes birthdayGradient{50%{background-position:100% 50%}}
@keyframes moonPulse{to{transform:scale(1.18);opacity:.7}}
@keyframes wishFly{to{transform:translateX(-150vw) translateY(var(--drift));opacity:0}}

/* ======================================================
   FOOTER
====================================================== */

footer{
  padding:80px 20px;
  text-align:center;
  opacity:.6;
}

/* ======================================================
   RESPONSIVE
====================================================== */

@media(max-width:768px){

  h1{
    letter-spacing:-2px;
  }

  .section-title{
    font-size:2.2rem;
  }

  .letter{
    padding:30px;
  }

  section{padding:85px 0}
  .language-switcher{top:12px;right:12px}
  .music-btn{bottom:14px;right:14px}

}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

</style>
</head>

<body>

<!-- ======================================================
     INTRO
====================================================== -->

<div class="intro" id="intro">
  <div class="intro-text">
    Preparando algo especial para Miriam...
  </div>

  <div class="intro-stars">
    ✦ ✦ ✦
  </div>
</div>

<!-- ======================================================
     BACKGROUND
====================================================== -->

<div class="space-background">

  <div class="nebula nebula-1"></div>
  <div class="nebula nebula-2"></div>
  <div class="nebula nebula-3"></div>

</div>

<canvas id="starsCanvas"></canvas>

<!-- ======================================================
     LANGUAGE
====================================================== -->

<div class="language-switcher">
  <button class="lang-btn active" data-lang="es">ES</button>
  <button class="lang-btn" data-lang="en">EN</button>
</div>

<!-- ======================================================
     MUSIC
====================================================== -->

<button class="music-btn" id="musicBtn" aria-label="Reproducir música" title="Reproducir música">
  ♫
</button>

<audio id="bgMusic" loop>
  <source src="./mp3/8.mp3" type="audio/mp3">
</audio>

<!-- ======================================================
     HERO
====================================================== -->

<header>

  <div class="hero">

    <div class="badge">
      <span class="dot"></span>
      <span data-i18n="badge"></span>
    </div>

    <h1>
      <span data-i18n="title_1"></span>
      <span class="gradient" data-i18n="title_2"></span>
    </h1>

    <p class="subtitle" data-i18n="subtitle"></p>

    <div class="scroll" data-i18n="scroll"></div>

  </div>

</header>

<!-- ======================================================
     SECTION
====================================================== -->

<section>

  <h2 class="section-title" data-i18n="section_title"></h2>

  <p class="section-description" data-i18n="section_description"></p>

  <div class="cards">

    <div class="card">
      <h3 data-i18n="card1_title"></h3>
      <p data-i18n="card1_text"></p>
    </div>

    <div class="card">
      <h3 data-i18n="card2_title"></h3>
      <p data-i18n="card2_text"></p>
    </div>

    <div class="card">
      <h3 data-i18n="card3_title"></h3>
      <p data-i18n="card3_text"></p>
    </div>

  </div>

</section>

<!-- ======================================================
     QUOTE
====================================================== -->

<section class="daily-star">
  <div class="daily-capsule">
    <div class="daily-kicker" data-i18n="daily_kicker"></div>
    <div class="daily-message" id="dailyMessage" aria-live="polite"></div>
    <div class="daily-date" id="dailyDate"></div>
  </div>
</section>

<section class="quote-section">

  <div class="quote" id="dynamicQuote"></div>

  <div class="quote-author" data-i18n="quote_author"></div>

</section>

<!-- ======================================================
     LETTER
====================================================== -->

<section>

  <div class="letter">

    <p data-i18n="letter_1"></p>
    <p data-i18n="letter_2"></p>
    <p data-i18n="letter_3"></p>
    <p data-i18n="letter_4"></p>
    <p data-i18n="letter_5"></p>

    <div class="letter-signature" data-i18n="signature"></div>

  </div>

</section>

<!-- ======================================================
     WISH
====================================================== -->

<section class="wish-section">

  <h2 class="section-title" data-i18n="wish_title"></h2>

  <p class="section-description" data-i18n="wish_description"></p>

  <button class="wish-button" id="wishButton" data-i18n="wish_button"></button>

  <div class="wish-message" id="wishMessage"></div>

</section>

<!-- ======================================================
     FOOTER
====================================================== -->

<footer data-i18n="footer"></footer>

<div class="birthday-experience" id="birthdayExperience" role="dialog" aria-modal="true" aria-labelledby="birthdayTitle">
  <canvas class="birthday-sky" id="birthdayCanvas"></canvas>
  <div class="birthday-glow"></div>
  <div class="birthday-wish-stream" id="birthdayWishStream"></div>
  <button class="birthday-close" id="birthdayClose" aria-label="Cerrar celebración">×</button>
  <div class="birthday-content">
    <div class="birthday-eyebrow" data-i18n="birthday_eyebrow"></div>
    <h2 class="birthday-title" id="birthdayTitle" data-i18n="birthday_title"></h2>
    <p class="birthday-copy" data-i18n="birthday_copy"></p>
    <button class="birthday-enter" id="birthdayEnter" data-i18n="birthday_enter"></button>
  </div>
</div>

<script src="./phrases.js"></script>
<script>

/* ======================================================
   INTRO
====================================================== */

window.addEventListener("load",()=>{

  setTimeout(()=>{

    document.getElementById("intro").classList.add("hidden");

  },2500);

});

/* ======================================================
   STARS CANVAS
====================================================== */

const canvas = document.getElementById("starsCanvas");
const ctx = canvas.getContext("2d");

function resizeCanvas(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

resizeCanvas();
window.addEventListener("resize",resizeCanvas);

const stars = [];

for(let i=0;i<250;i++){

  stars.push({
    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,
    radius:Math.random()*1.5,
    speed:Math.random()*0.3,
    opacity:Math.random()
  });

}

function animateStars(){

  ctx.clearRect(0,0,canvas.width,canvas.height);

  stars.forEach(star=>{

    star.y += star.speed;

    if(star.y > canvas.height){
      star.y = 0;
    }

    ctx.beginPath();
    ctx.arc(star.x,star.y,star.radius,0,Math.PI*2);
    ctx.fillStyle = `rgba(255,255,255,${star.opacity})`;
    ctx.fill();

  });

  requestAnimationFrame(animateStars);

}

animateStars();

/* ======================================================
   SHOOTING STARS
====================================================== */

function createShootingStar(){

  const star = document.createElement("div");

  star.className = "shooting-star";

  star.style.top = Math.random()*40 + "vh";
  star.style.left = Math.random()*100 + "vw";

  document.body.appendChild(star);

  setTimeout(()=>{

    star.remove();

  },2000);

}

setInterval(createShootingStar,7000);

/* ======================================================
   MUSIC
====================================================== */

const musicBtn = document.getElementById("musicBtn");
const bgMusic = document.getElementById("bgMusic");

let playing = false;

musicBtn.addEventListener("click",()=>{

  if(!playing){

    bgMusic.play();
    musicBtn.innerHTML = "❚❚";
    musicBtn.setAttribute("aria-label","Pausar música");
    musicBtn.title = "Pausar música";
    playing = true;

  }else{

    bgMusic.pause();
    musicBtn.innerHTML = "♫";
    musicBtn.setAttribute("aria-label","Reproducir música");
    musicBtn.title = "Reproducir música";
    playing = false;

  }

});

/* ======================================================
   TRANSLATIONS
====================================================== */

const translations = {

  es:{

    badge:"Un pequeño universo para Miriam",

    title_1:"Entre galaxias",
    title_2:"y sueños",

    subtitle:"Este lugar existe para recordarte que incluso en los días silenciosos, sigues brillando como una estrella lejana en medio del universo.",

    greetings:[
      "Hoy este rincón existe para recordarte que tu luz también cuenta en los días silenciosos.",
      "El universo cambia cada noche, y esta página cambia para dejarte hoy una razón nueva para sonreír.",
      "Si el día se siente demasiado rápido, quédate un momento: hay algo bonito escrito especialmente para ti.",
      "No todas las estrellas se ven a simple vista. Tu forma de iluminar la vida de otros es una de ellas.",
      "Hay días comunes que se vuelven extraordinarios con un solo pensamiento: qué suerte que existes, Miriam.",
      "Este pequeño universo vuelve a despertar hoy solamente para decirte algo que quizá necesitas escuchar.",
      "Entre todo el ruido del mundo, este lugar siempre guardará un instante de calma para ti."
    ],

    scroll:"Desliza lentamente ✨",

    section_title:"Pequeños recordatorios del universo",

    section_description:"A veces el corazón necesita pausas suaves, como estrellas descansando entre nebulosas.",

    daily_kicker:"Una estrella para hoy",

let currentLang = localStorage.getItem("language") || "es";
let dynamicSeed = Math.floor(Math.random()*100000);
let lastDynamicRefresh = Date.now();

function animateRefresh(elements){
  elements.forEach(element=>{
    element.classList.remove("content-refresh");
    void element.offsetWidth;
    element.classList.add("content-refresh");
  });
}

function refreshDynamicContent(animate=true){
  const lang = currentLang;
  const now = new Date();
  const source = lang === "es" && typeof appPhrases !== "undefined" && appPhrases.length
    ? appPhrases
    : translations[lang].daily;
  const cardBank = translations[lang].cardSets.flat();
  const greetingIndex = dynamicSeed % translations[lang].greetings.length;
  const messageIndex = (dynamicSeed * 17 + 7) % source.length;
  const cardStart = (dynamicSeed * 5) % cardBank.length;
  const cardsForNow = [0,1,2].map(index=>cardBank[(cardStart + index * 4) % cardBank.length]);

  document.querySelector(".subtitle").textContent = translations[lang].greetings[greetingIndex];
  document.getElementById("dailyMessage").textContent = source[messageIndex];
  document.getElementById("dailyDate").textContent = new Intl.DateTimeFormat(
    lang === "es" ? "es-MX" : "en-US",
    {weekday:"long",day:"numeric",month:"long"}
  ).format(now);
  document.querySelectorAll(".cards .card").forEach((card,index)=>{
    card.querySelector("h3").textContent = cardsForNow[index][0];
    card.querySelector("p").textContent = cardsForNow[index][1];
  });

  if(animate){
    animateRefresh([
      document.querySelector(".subtitle"),
      document.getElementById("dailyMessage"),
      ...document.querySelectorAll(".cards .card")
    ]);
  }
  lastDynamicRefresh = Date.now();
}

function rotateDynamicContent(){
  const previousSeed = dynamicSeed;
  const lang = currentLang;
  const sourceLength = lang === "es" && typeof appPhrases !== "undefined" && appPhrases.length
    ? appPhrases.length
    : translations[lang].daily.length;
  const greetingLength = translations[lang].greetings.length;
  const cardLength = translations[lang].cardSets.flat().length;
  do{
    dynamicSeed=Math.floor(Math.random()*100000);
  }while(
    dynamicSeed % greetingLength === previousSeed % greetingLength ||
    (dynamicSeed * 17 + 7) % sourceLength === (previousSeed * 17 + 7) % sourceLength ||
    (dynamicSeed * 5) % cardLength === (previousSeed * 5) % cardLength
  );
  refreshDynamicContent(true);
}

/* ======================================================
   LANGUAGE
====================================================== */

function changeLanguage(lang){

  currentLang = lang;

  document.querySelectorAll("[data-i18n]").forEach(el=>{

    const key = el.getAttribute("data-i18n");

    el.innerHTML = translations[lang][key];

  });

  const randomQuote = translations[lang].quotes[
    Math.floor(Math.random()*translations[lang].quotes.length)
  ];

  document.getElementById("dynamicQuote").innerHTML = `"${randomQuote}"`;

  refreshDynamicContent(false);

  document.querySelectorAll(".lang-btn").forEach(btn=>{
    btn.classList.remove("active");
  });

  document.querySelector(`[data-lang="${lang}"]`)
    .classList.add("active");

  localStorage.setItem("language",lang);

}

document.querySelectorAll(".lang-btn").forEach(btn=>{

  btn.addEventListener("click",()=>{

    changeLanguage(btn.dataset.lang);

  });

});

changeLanguage(currentLang);

setInterval(()=>{
  if(!document.hidden && document.hasFocus()) rotateDynamicContent();
},60000);

window.addEventListener("focus",()=>{
  if(Date.now()-lastDynamicRefresh>=60000) rotateDynamicContent();
});

/* ======================================================

====================================================== */

const birthdayMonth = 8;
const birthdayDay = 31;

const today = new Date();

const birthdayExperience = document.getElementById("birthdayExperience");
const birthdayCanvas = document.getElementById("birthdayCanvas");
const birthdayCtx = birthdayCanvas.getContext("2d");
const birthdayWishStream = document.getElementById("birthdayWishStream");
let birthdayActive = false;
let birthdayAnimation;
let birthdayStars = [];
let fireworks = [];
let sparks = [];
let wishTimer;

function sizeBirthdaySky(){
  const ratio = Math.min(window.devicePixelRatio || 1,2);
  birthdayCanvas.width = innerWidth * ratio;
  birthdayCanvas.height = innerHeight * ratio;
  birthdayCanvas.style.width = innerWidth + "px";
  birthdayCanvas.style.height = innerHeight + "px";
  birthdayCtx.setTransform(ratio,0,0,ratio,0,0);
  birthdayStars = Array.from({length:Math.min(260,Math.floor(innerWidth/4))},()=>({
    x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.5+.25,
    a:Math.random()*.7+.2,p:Math.random()*.025+.008
  }));
}

function launchFirework(x=Math.random()*innerWidth,y=innerHeight*(.12+Math.random()*.5)){
  fireworks.push({x:x,y:innerHeight,tx:x,ty:y,trail:[],hue:Math.random()*360});
}

function explodeFirework(firework){
  const count = innerWidth < 600 ? 55 : 85;
  for(let i=0;i<count;i++){
    const angle=Math.PI*2*i/count, speed=1.5+Math.random()*5;
    sparks.push({x:firework.x,y:firework.y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,
      life:1,decay:.009+Math.random()*.013,hue:firework.hue+Math.random()*35});
  }
}

function drawBirthdaySky(){
  if(!birthdayActive) return;
  birthdayCtx.fillStyle="rgba(2,3,12,.2)";
  birthdayCtx.fillRect(0,0,innerWidth,innerHeight);
  birthdayStars.forEach(star=>{
    star.a += star.p;
    if(star.a>1 || star.a<.18) star.p*=-1;
    birthdayCtx.beginPath();birthdayCtx.arc(star.x,star.y,star.r,0,Math.PI*2);
    birthdayCtx.fillStyle=`rgba(255,255,255,${star.a})`;birthdayCtx.fill();
  });
  if(Math.random()<.025) launchFirework();
  fireworks.forEach((f,index)=>{
    f.trail.push([f.x,f.y]);if(f.trail.length>9)f.trail.shift();
    f.x+=(f.tx-f.x)*.055;f.y+=(f.ty-f.y)*.055;
    birthdayCtx.beginPath();f.trail.forEach((point,i)=>i?birthdayCtx.lineTo(...point):birthdayCtx.moveTo(...point));
    birthdayCtx.strokeStyle=`hsla(${f.hue},100%,75%,.85)`;birthdayCtx.lineWidth=2;birthdayCtx.stroke();
    if(Math.hypot(f.tx-f.x,f.ty-f.y)<8){explodeFirework(f);fireworks.splice(index,1)}
  });
  sparks.forEach((spark,index)=>{
    spark.x+=spark.vx;spark.y+=spark.vy;spark.vy+=.035;spark.vx*=.992;spark.life-=spark.decay;
    birthdayCtx.beginPath();birthdayCtx.arc(spark.x,spark.y,1.6,0,Math.PI*2);
    birthdayCtx.fillStyle=`hsla(${spark.hue},100%,70%,${spark.life})`;birthdayCtx.fill();
    if(spark.life<=0)sparks.splice(index,1);
  });
  birthdayAnimation=requestAnimationFrame(drawBirthdaySky);
}

function sendBirthdayWish(){
  if(!birthdayActive) return;
  const wishes = currentLang === "es" && typeof appPhrases !== "undefined" ? appPhrases : translations[currentLang].wishes;
  const wish=document.createElement("span");
  wish.className="flying-wish";
  wish.textContent="✦ "+wishes[Math.floor(Math.random()*wishes.length)];
  wish.style.top=(8+Math.random()*84)+"%";
  wish.style.setProperty("--duration",(10+Math.random()*10)+"s");
  wish.style.setProperty("--drift",(-80+Math.random()*160)+"px");
  birthdayWishStream.appendChild(wish);
  wish.addEventListener("animationend",()=>wish.remove());
}

function openBirthdayExperience(){
  birthdayExperience.classList.add("show");
  document.body.style.overflow="hidden";
  birthdayActive=true;sizeBirthdaySky();drawBirthdaySky();
  for(let i=0;i<4;i++)setTimeout(()=>launchFirework(),i*350);
  sendBirthdayWish();wishTimer=setInterval(sendBirthdayWish,1700);
}

function closeBirthdayExperience(){
  birthdayActive=false;cancelAnimationFrame(birthdayAnimation);clearInterval(wishTimer);
  birthdayExperience.classList.remove("show");document.body.style.overflow="";
  birthdayWishStream.textContent="";
}

document.getElementById("birthdayEnter").addEventListener("click",()=>{
  for(let i=0;i<10;i++)setTimeout(()=>launchFirework(innerWidth*(.08+Math.random()*.84),innerHeight*(.08+Math.random()*.48)),i*180);
  if(!playing){bgMusic.play().then(()=>{playing=true;musicBtn.innerHTML="❚❚"}).catch(()=>{});}
});
document.getElementById("birthdayClose").addEventListener("click",closeBirthdayExperience);
window.addEventListener("resize",()=>{if(birthdayActive)sizeBirthdaySky()});

if(
  today.getMonth()+1 === birthdayMonth &&
  today.getDate() === birthdayDay
){
  setTimeout(openBirthdayExperience,2800);
}
