<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="UTF-8"/>
		<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
		<title>404 · Nochebuena</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
				font-family: 'Segoe UI', system-ui, sans-serif;
			}

			body {
				min-height: 100vh;
				background: radial-gradient(circle at bottom, #0b2a1d, #06130c);
				color: #eef7f0;
				overflow: hidden;
				opacity: 0;
				animation: fadeIn 2s ease forwards;
			}

			@keyframes fadeIn {
				to {
					opacity: 1;
				}
			}

			/* Cielo */
			.sky {
				position: fixed;
				inset: 0;
				z-index: 0;
			}

			/* Estrellas */
			.stars::before {
				content: '';
				position: absolute;
				width: 2px;
				height: 2px;
				background: white;
				box-shadow: 15vw 10vh white, 35vw 30vh white, 60vw 20vh white, 75vw 50vh white, 20vw 70vh white, 50vw 80vh white;
				opacity: 0.6;
				animation: twinkle 6s infinite ease-in-out;
			}

			@keyframes twinkle {
				0,
				100% {
					opacity: 0.3;
				}
				50% {
					opacity: 0.8;
				}
			}

			/* Luna cálida */
			.moon {
				position: absolute;
				top: 8%;
				right: 12%;
				width: 85px;
				height: 85px;
				border-radius: 50%;
				background: radial-gradient(circle, #fff7d6 35%, #e0cfa0 70%);
				box-shadow: 0 0 30px rgba(255, 240, 200, 0.35);
			}

			/* Nieve */
			.snow::before {
				content: '';
				position: absolute;
				width: 3px;
				height: 3px;
				background: white;
				border-radius: 50%;
				box-shadow: 10vw 0 white, 30vw -20vh white, 50vw -40vh white, 70vw -10vh white, 90vw -30vh white;
				animation: snow 12s linear infinite;
				opacity: 0.7;
			}

			@keyframes snow {
				to {
					transform: translateY(120vh);
				}
			}

			/* Contenido */
			.container {
				position: relative;
				z-index: 1;
				height: 100vh;
				display: flex;
				flex-direction: column;
				justify-content: center;
				align-items: center;
				text-align: center;
				padding: 20px;
			}

			h1 {
				font-size: 4.8rem;
				letter-spacing: 6px;
				opacity: 0.85;
			}

			.message {
				margin-top: 15px;
				font-size: 1.1rem;
				line-height: 1.6;
			}

			.sub {
				margin-top: 12px;
				font-size: 0.95rem;
				opacity: 0.85;
			}

			.back {
				margin-top: 30px;
				text-decoration: none;
				color: #fff;
				border: 1px solid rgba(255, 255, 255, 0.35);
				padding: 10px 26px;
				border-radius: 20px;
				transition: all 0.3s ease;
			}

			.back:hover {
				background: rgba(255, 255, 255, 0.15);
				transform: translateY(-2px);
			}
		</style>
	</head>
	<body>

		<div class="sky">
			<div class="stars"></div>
			<div class="moon"></div>
			<div class="snow"></div>
		</div>

		<main class="container">
			<h1>404</h1>

			<p class="message">
				Esta página no está aquí…<br>
				pero esta noche sigue siendo especial.
			</p>

			<p class="sub">
				Que la Navidad te regale calma, luz y momentos bonitos. 🎄✨
			</p>
		</main>

	</body>
</html>
