<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>For Miriam ✨</title>
<link rel="icon" href="./favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">

<style>

/* ======================================================
   RESET
====================================================== */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:'Inter',sans-serif;
  overflow-x:hidden;
  background:#050816;
  color:white;
  min-height:100vh;
  position:relative;
}

/* ======================================================
   COSMIC BACKGROUND
====================================================== */

.space-background{
  position:fixed;
  inset:0;
  overflow:hidden;
  z-index:-10;
}

.nebula{
  position:absolute;
  border-radius:50%;
  filter:blur(120px);
  opacity:.35;
  animation:nebulaMove 30s ease-in-out infinite alternate;
}

.nebula-1{
  width:600px;
  height:600px;
  background:#4f46e5;
  top:-100px;
  left:-150px;
}

.nebula-2{
  width:500px;
  height:500px;
  background:#ec4899;
  top:30%;
  right:-100px;
  animation-duration:35s;
}

.nebula-3{
  width:450px;
  height:450px;
  background:#06b6d4;
  bottom:-120px;
  left:20%;
  animation-duration:40s;
}

@keyframes nebulaMove{
  from{
    transform:translateY(0) translateX(0) scale(1);
  }
  to{
    transform:translateY(40px) translateX(30px) scale(1.15);
  }
}

/* ======================================================
   STARS CANVAS
====================================================== */

#starsCanvas{
  position:fixed;
  inset:0;
  z-index:-9;
}

/* ======================================================
   INTRO
====================================================== */

.intro{
  position:fixed;
  inset:0;
  background:#03050d;
  z-index:99999;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  transition:1.5s ease;
}

.intro.hidden{
  opacity:0;
  pointer-events:none;
}

.intro-text{
  font-size:1.2rem;
  letter-spacing:4px;
  text-transform:uppercase;
  opacity:.7;
  animation:pulse 2s infinite;
}

.intro-stars{
  margin-top:30px;
  font-size:2rem;
  animation:float 3s ease-in-out infinite;
}

@keyframes pulse{
  0%,100%{opacity:.4;}
  50%{opacity:1;}
}

/* ======================================================
   LANGUAGE SWITCHER
====================================================== */

.language-switcher{
  position:fixed;
  top:20px;
  right:20px;
  z-index:999;
  display:flex;
  gap:10px;
}

.lang-btn{
  border:none;
  padding:10px 15px;
  border-radius:999px;
  background:rgba(255,255,255,0.08);
  color:white;
  cursor:pointer;
  border:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(12px);
  transition:.3s ease;
}

.lang-btn.active{
  background:linear-gradient(135deg,#63e6ff,#8b5cf6);
  box-shadow:0 0 25px rgba(99,230,255,.4);
}

/* ======================================================
   MUSIC BUTTON
====================================================== */

.music-btn{
  position:fixed;
  bottom:20px;
  right:20px;
  width:58px;
  height:58px;
  border-radius:50%;
  border:none;
  background:rgba(255,255,255,.08);
  color:white;
  font-size:1.2rem;
  cursor:pointer;
  backdrop-filter:blur(12px);
  z-index:999;
  transition:.3s ease;
}

.music-btn:hover{
  transform:scale(1.08);
}

/* ======================================================
   HERO
====================================================== */

header{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:40px;
  position:relative;
}

.hero{
  max-width:950px;
}

.badge{
  display:inline-flex;
  gap:10px;
  align-items:center;
  padding:10px 18px;
  border-radius:999px;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(12px);
  margin-bottom:30px;
}

.dot{
  width:10px;
  height:10px;
  border-radius:50%;
  background:#63e6ff;
  box-shadow:0 0 15px #63e6ff;
}

h1{
  font-family:'Space Grotesk',sans-serif;
  font-size:clamp(3rem,8vw,7rem);
  line-height:1;
  letter-spacing:-4px;
  margin-bottom:30px;
}

.gradient{
  background:linear-gradient(135deg,#63e6ff,#c084fc,#ec4899);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.subtitle{
  font-size:1.15rem;
  line-height:2;
  opacity:.8;
  max-width:720px;
  margin:auto;
}

.scroll{
  margin-top:60px;
  opacity:.6;
  animation:float 3s ease-in-out infinite;
}

@keyframes float{
  0%,100%{
    transform:translateY(0);
  }
  50%{
    transform:translateY(10px);
  }
}

/* ======================================================
   SECTIONS
====================================================== */

section{
  width:min(1100px,92%);
  margin:auto;
  padding:120px 0;
}

.section-title{
  text-align:center;
  font-size:3rem;
  margin-bottom:20px;
  font-family:'Space Grotesk',sans-serif;
}

.section-description{
  text-align:center;
  opacity:.7;
  max-width:700px;
  margin:0 auto 60px;
  line-height:1.8;
}

/* ======================================================
   CARDS
====================================================== */

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:30px;
}

.card{
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.08);
  border-radius:30px;
  padding:35px;
  backdrop-filter:blur(14px);
  transition:.4s ease;
  position:relative;
  overflow:hidden;
  isolation:isolate;
}

.card::before{
  content:"";
  position:absolute;
  width:260px;
  height:260px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(99,230,255,.22) 0%,rgba(139,92,246,.1) 38%,transparent 70%);
  top:-145px;
  right:-115px;
  filter:blur(8px);
  pointer-events:none;
  z-index:-1;
  transition:transform .6s ease,opacity .6s ease;
}

.card::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  background:linear-gradient(125deg,rgba(255,255,255,.07),transparent 35%);
  pointer-events:none;
  z-index:-1;
}

.card:hover{
  transform:translateY(-10px);
  border-color:rgba(99,230,255,.35);
  box-shadow:0 0 35px rgba(99,230,255,.15);
}

.card:hover::before{
  transform:translate(-18px,18px) scale(1.12);
  opacity:.9;
}

.card h3{
  margin-bottom:18px;
  font-size:1.4rem;
  position:relative;
  z-index:1;
}

.card p{
  opacity:.75;
  line-height:1.9;
  position:relative;
  z-index:1;
}

/* ======================================================
   QUOTE
====================================================== */

.quote-section{
  text-align:center;
}

.quote{
  font-size:clamp(1.7rem,4vw,3rem);
  line-height:1.6;
  max-width:900px;
  margin:auto;
  font-family:'Space Grotesk',sans-serif;
}

.quote-author{
  margin-top:30px;
  opacity:.6;
}

/* ======================================================
   LETTER
====================================================== */

.letter{
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.08);
  border-radius:35px;
  padding:50px;
  backdrop-filter:blur(15px);
  max-width:850px;
  margin:auto;
}

.letter p{
  line-height:2;
  opacity:.82;
  margin-bottom:24px;
}

.letter-signature{display:flex;align-items:center;gap:14px;margin-top:34px;color:#c4b5fd;font-family:'Space Grotesk',sans-serif}
.letter-signature::before{content:"";width:42px;height:1px;background:linear-gradient(90deg,transparent,#c4b5fd)}

/* DAILY STAR */
.daily-star{text-align:center}
.daily-capsule{max-width:780px;margin:0 auto;padding:clamp(32px,6vw,64px);border:1px solid rgba(255,255,255,.12);border-radius:40px;background:radial-gradient(circle at 50% 0,rgba(192,132,252,.2),transparent 45%),rgba(255,255,255,.045);backdrop-filter:blur(18px);box-shadow:0 30px 80px rgba(0,0,0,.25);position:relative;overflow:hidden}
.daily-kicker{color:#a5f3fc;font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;margin-bottom:22px}
.daily-message{font-family:'Space Grotesk',sans-serif;font-size:clamp(1.45rem,4vw,2.35rem);line-height:1.55}
.daily-date{margin-top:26px;opacity:.55;font-size:.9rem;text-transform:capitalize}

.content-refresh{animation:contentRefresh .65s ease both}
@keyframes contentRefresh{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}

/* ======================================================
   WISH SECTION
====================================================== */

.wish-section{
  text-align:center;
}

.wish-button{
  margin-top:40px;
  padding:18px 30px;
  border:none;
  border-radius:999px;
  background:linear-gradient(135deg,#63e6ff,#8b5cf6);
  color:white;
  cursor:pointer;
  font-size:1rem;
  transition:.4s ease;
}

.wish-button:hover{
  transform:scale(1.05);
}

.wish-message{
  margin-top:40px;
  opacity:0;
  transform:translateY(20px);
  transition:1s ease;
  font-size:1.3rem;
  max-width:700px;
  margin-inline:auto;
  line-height:1.8;
}

.wish-message.show{
  opacity:1;
  transform:translateY(0);
}

/* ======================================================
   SHOOTING STAR
====================================================== */

.shooting-star{
  position:fixed;
  width:3px;
  height:3px;
  background:white;
  border-radius:50%;
  box-shadow:0 0 20px white;
  z-index:-1;
  animation:shoot 2s linear forwards;
}

.shooting-star::after{
  content:"";
  position:absolute;
  width:180px;
  height:2px;
  background:linear-gradient(to right,white,transparent);
  transform:translateX(-100%);
}

@keyframes shoot{
  from{
    transform:translate(0,0);
    opacity:1;
  }
  to{
    transform:translate(-800px,500px);
    opacity:0;
  }
}

/* ======================================================
   BIRTHDAY MODE
====================================================== */

.birthday-banner{
  position:fixed;
  top:4rem;
  left:50%;
  transform:translateX(-50%);
  background:linear-gradient(135deg,#ec4899,#8b5cf6,#63e6ff);
  padding:22px 35px;
  border-radius:20px;
  z-index:9999;
  box-shadow:0 0 40px rgba(236,72,153,.45);
  animation:float 4s ease-in-out infinite;
}

/* ======================================================
   BIRTHDAY EXPERIENCE
====================================================== */

.birthday-experience{position:fixed;inset:0;z-index:100000;background:#02030c;display:none;place-items:start center;overflow-x:hidden;overflow-y:auto;padding:clamp(64px,8vh,90px) 24px 32px}
.birthday-experience.show{display:grid;animation:birthdayReveal 1.4s ease both}
.birthday-sky{position:fixed;inset:0;z-index:3;width:100%;height:100%;pointer-events:none;mix-blend-mode:screen}
.birthday-glow{position:absolute;width:min(70vw,800px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(139,92,246,.2),transparent 68%);filter:blur(20px);animation:moonPulse 6s ease-in-out infinite alternate}
.birthday-content{position:relative;z-index:2;text-align:center;width:min(1000px,94vw);padding:clamp(28px,6vw,64px);border:1px solid rgba(255,255,255,.14);border-radius:40px;background:rgba(3,5,18,.72);backdrop-filter:blur(12px);box-shadow:0 0 100px rgba(99,230,255,.12)}
.birthday-eyebrow{letter-spacing:.28em;text-transform:uppercase;color:#a5f3fc;font-size:.72rem;margin-bottom:20px}
.birthday-title{font-family:'Space Grotesk',sans-serif;font-size:clamp(2.8rem,9vw,6.7rem);line-height:.95;letter-spacing:-.05em;background:linear-gradient(120deg,#fff,#a5f3fc,#c4b5fd,#f9a8d4);background-size:250% 250%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:birthdayGradient 5s ease infinite}
.birthday-copy{max-width:700px;margin:28px auto 0;font-size:clamp(1rem,2.5vw,1.25rem);line-height:1.9;color:rgba(255,255,255,.85)}
.birthday-enter{margin-top:30px;padding:15px 26px;border:1px solid rgba(255,255,255,.2);border-radius:999px;background:linear-gradient(135deg,#06b6d4,#8b5cf6,#ec4899);color:#fff;font:600 1rem 'Inter',sans-serif;cursor:pointer;box-shadow:0 0 35px rgba(139,92,246,.35)}
.birthday-memories{width:100%;max-width:none;margin:50px 0 0;padding:38px 0 0;border-top:1px solid rgba(255,255,255,.12)}
.memories-title{font-family:'Space Grotesk',sans-serif;font-size:clamp(1.7rem,4vw,2.5rem);margin-bottom:8px}
.memories-subtitle{color:rgba(255,255,255,.62);line-height:1.7;margin-bottom:24px}
.memory-carousel{position:relative;max-width:760px;margin:auto}
.memory-card{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(230px,.75fr);min-height:330px;overflow:hidden;border:1px solid rgba(255,255,255,.14);border-radius:28px;background:rgba(255,255,255,.055);text-align:left}
.memory-visual{position:relative;min-height:300px;background:radial-gradient(circle at 25% 20%,rgba(99,230,255,.2),transparent 35%),radial-gradient(circle at 80% 75%,rgba(236,72,153,.22),transparent 40%),linear-gradient(145deg,#11152e,#211341);display:grid;place-items:center;overflow:hidden}
.memory-visual img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.memory-placeholder{text-align:center;color:rgba(255,255,255,.72);padding:30px}
.memory-placeholder-icon{display:block;font-size:3.3rem;margin-bottom:12px;filter:drop-shadow(0 0 16px rgba(165,243,252,.45))}
.memory-copy{display:flex;flex-direction:column;justify-content:center;padding:clamp(24px,4vw,38px)}
.memory-number{color:#a5f3fc;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;margin-bottom:14px}
.memory-message{font-size:clamp(1rem,2vw,1.18rem);line-height:1.8;color:rgba(255,255,255,.88)}
.memory-controls{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:20px}
.memory-arrow{width:44px;height:44px;border:1px solid rgba(255,255,255,.18);border-radius:50%;background:rgba(255,255,255,.07);color:#fff;font-size:1.2rem;cursor:pointer;transition:.25s ease}
.memory-arrow:hover{background:rgba(99,230,255,.16);border-color:rgba(99,230,255,.45)}
.memory-dots{display:flex;gap:9px}
.memory-dot{width:9px;height:9px;border:0;border-radius:50%;background:rgba(255,255,255,.25);padding:0;cursor:pointer;transition:.25s ease}
.memory-dot.active{width:25px;border-radius:99px;background:#a5f3fc;box-shadow:0 0 12px rgba(165,243,252,.6)}
.birthday-wish-stream{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.flying-wish{position:absolute;left:105%;white-space:nowrap;color:rgba(255,255,255,.82);font-size:clamp(.72rem,1.6vw,.95rem);text-shadow:0 0 12px #fff;animation:wishFly var(--duration) linear forwards}
.birthday-close{position:absolute;top:18px;right:18px;z-index:5;width:44px;height:44px;border:1px solid rgba(255,255,255,.18);border-radius:50%;background:rgba(255,255,255,.08);color:#fff;font-size:1.2rem;cursor:pointer}
@keyframes birthdayReveal{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:scale(1)}}
@keyframes birthdayGradient{50%{background-position:100% 50%}}
@keyframes moonPulse{to{transform:scale(1.18);opacity:.7}}
@keyframes wishFly{to{transform:translateX(-150vw) translateY(var(--drift));opacity:0}}

/* ======================================================
   FOOTER
====================================================== */

footer{
  padding:80px 20px;
  text-align:center;
  opacity:.6;
}

/* ======================================================
   RESPONSIVE
====================================================== */

@media(max-width:768px){

  h1{
    letter-spacing:-2px;
  }

  .section-title{
    font-size:2.2rem;
  }

  .letter{
    padding:30px;
  }

  section{padding:85px 0}
  .language-switcher{top:12px;right:12px}
  .music-btn{bottom:14px;right:14px}
  .birthday-experience{padding:64px 14px 24px}
  .birthday-content{padding:28px 18px;border-radius:28px}
  .memory-card{grid-template-columns:1fr}
  .memory-visual{min-height:260px}

}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

</style>
</head>

<body>

<!-- ======================================================
     INTRO
====================================================== -->

<div class="intro" id="intro">
  <div class="intro-text">
    Preparando algo especial para Miriam...
  </div>

  <div class="intro-stars">
    ✦ ✦ ✦
  </div>
</div>

<!-- ======================================================
     BACKGROUND
====================================================== -->

<div class="space-background">

  <div class="nebula nebula-1"></div>
  <div class="nebula nebula-2"></div>
  <div class="nebula nebula-3"></div>

</div>

<canvas id="starsCanvas"></canvas>

<!-- ======================================================
     LANGUAGE
====================================================== -->

<div class="language-switcher">
  <button class="lang-btn active" data-lang="es">ES</button>
  <button class="lang-btn" data-lang="en">EN</button>
</div>

<!-- ======================================================
     MUSIC
====================================================== -->

<button class="music-btn" id="musicBtn" aria-label="Reproducir música aleatoria" title="Reproducir música aleatoria">
  ♫
</button>

<audio id="bgMusic" preload="metadata"></audio>

<!-- ======================================================
     HERO
====================================================== -->

<header>

  <div class="hero">

    <div class="badge">
      <span class="dot"></span>
      <span data-i18n="badge"></span>
    </div>

    <h1>
      <span data-i18n="title_1"></span>
      <span class="gradient" data-i18n="title_2"></span>
    </h1>

    <p class="subtitle" data-i18n="subtitle"></p>

    <div class="scroll" data-i18n="scroll"></div>

  </div>

</header>

<!-- ======================================================
     SECTION
====================================================== -->

<section>

  <h2 class="section-title" data-i18n="section_title"></h2>

  <p class="section-description" data-i18n="section_description"></p>

  <div class="cards">

    <div class="card">
      <h3 data-i18n="card1_title"></h3>
      <p data-i18n="card1_text"></p>
    </div>

    <div class="card">
      <h3 data-i18n="card2_title"></h3>
      <p data-i18n="card2_text"></p>
    </div>

    <div class="card">
      <h3 data-i18n="card3_title"></h3>
      <p data-i18n="card3_text"></p>
    </div>

  </div>

</section>

<!-- ======================================================
     QUOTE
====================================================== -->

<section class="daily-star">
  <div class="daily-capsule">
    <div class="daily-kicker" data-i18n="daily_kicker"></div>
    <div class="daily-message" id="dailyMessage" aria-live="polite"></div>
    <div class="daily-date" id="dailyDate"></div>
  </div>
</section>

<section class="quote-section">

  <div class="quote" id="dynamicQuote"></div>

  <div class="quote-author" data-i18n="quote_author"></div>

</section>

<!-- ======================================================
     LETTER
====================================================== -->

<section>

  <div class="letter">

    <p data-i18n="letter_1"></p>
    <p data-i18n="letter_2"></p>
    <p data-i18n="letter_3"></p>
    <p data-i18n="letter_4"></p>
    <p data-i18n="letter_5"></p>

    <div class="letter-signature" data-i18n="signature"></div>

  </div>

</section>

<!-- ======================================================
     WISH
====================================================== -->

<section class="wish-section">

  <h2 class="section-title" data-i18n="wish_title"></h2>

  <p class="section-description" data-i18n="wish_description"></p>

  <button class="wish-button" id="wishButton" data-i18n="wish_button"></button>

  <div class="wish-message" id="wishMessage"></div>

</section>

<!-- ======================================================
     FOOTER
====================================================== -->

<footer data-i18n="footer"></footer>

<div class="birthday-experience" id="birthdayExperience" role="dialog" aria-modal="true" aria-labelledby="birthdayTitle">
  <canvas class="birthday-sky" id="birthdayCanvas"></canvas>
  <div class="birthday-glow"></div>
  <div class="birthday-wish-stream" id="birthdayWishStream"></div>
  <button class="birthday-close" id="birthdayClose" aria-label="Cerrar celebración">×</button>
  <div class="birthday-content">
    <div class="birthday-eyebrow" data-i18n="birthday_eyebrow"></div>
    <h2 class="birthday-title" id="birthdayTitle" data-i18n="birthday_title"></h2>
    <p class="birthday-copy" data-i18n="birthday_copy"></p>
    <button class="birthday-enter" id="birthdayEnter" data-i18n="birthday_enter"></button>
    <section class="birthday-memories" aria-labelledby="memoriesTitle">
      <h3 class="memories-title" id="memoriesTitle"></h3>
      <p class="memories-subtitle" id="memoriesSubtitle"></p>
      <div class="memory-carousel" id="memoryCarousel" aria-roledescription="carrusel">
        <article class="memory-card" id="memoryCard" aria-live="polite">
          <div class="memory-visual" id="memoryVisual"></div>
          <div class="memory-copy">
            <div class="memory-number" id="memoryNumber"></div>
            <p class="memory-message" id="memoryMessage"></p>
          </div>
        </article>
        <div class="memory-controls">
          <button class="memory-arrow" id="memoryPrevious" aria-label="Recuerdo anterior">←</button>
          <div class="memory-dots" id="memoryDots" aria-label="Elegir recuerdo"></div>
          <button class="memory-arrow" id="memoryNext" aria-label="Siguiente recuerdo">→</button>
        </div>
      </div>
    </section>
